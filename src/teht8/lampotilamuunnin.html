<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lämpötilamuunnin</title>
</head>
<body>
    <h2>Lämpötilamuunnin</h2>
    <form method="get" action="laskin.php">
        
        <label for="lampotila">Lampotila:</label>
        <input type="number" name="lampotila" step="0.01" min="-40" max="40">

        <input type="submit" value="Muunna">

        <br>

        <label>Valitse muunnos:</label>

        <select name="muunnos" required>
            <option value="">-- Valitse --</option>
            <option value="CtoF">Celsius → Fahrenheit</option>
            <option value="CtoF">Celsius → Farenheit</option>
            <option value="CtoK">Celsius → Kelvin</option>
        </select>

        <br>

        <label for="F_to_C">Fahrenheit → Celsius</label>

    </form>
</body>
</html>
